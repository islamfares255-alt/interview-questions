<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أسئلة المقابلات الشخصية | اللجنة المركزية للتنظيم والمراسم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf6f5;--ink:#22090c;--mut:#7a5c60;--red:#d10f1c;--red2:#7d050e;--card:#fff;--line:#f1d8da;--chip:#fdecee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12060a;--ink:#fbeff0;--mut:#bc9ca2;--card:#1e0c11;--line:#3b1a21;--chip:#2c1016;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12060a;--ink:#fbeff0;--mut:#bc9ca2;--card:#1e0c11;--line:#3b1a21;--chip:#2c1016;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,'Segoe UI',Tahoma,sans-serif;line-height:1.7;overflow-x:hidden}
#glow{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(420px circle at var(--x,50%) var(--y,30%),rgba(209,15,28,.13),transparent 70%)}
#bar{position:fixed;top:0;right:0;height:4px;width:0;background:linear-gradient(90deg,#ff4d5a,#d10f1c);z-index:50;box-shadow:0 0 14px #ff2d3d}
/* hero */
.hero{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;gap:48px;flex-wrap:wrap;padding:80px 6vw 120px;color:#fff;overflow:hidden;background:linear-gradient(135deg,#5e040c,#c4101c,#7d050e,#d10f1c);background-size:300% 300%;animation:shift 14s ease infinite}
.hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.22) 1.5px,transparent 1.6px);background-size:34px 34px;-webkit-mask-image:radial-gradient(circle at 50% 50%,#000,transparent 75%);mask-image:radial-gradient(circle at 50% 50%,#000,transparent 75%);animation:drift 20s linear infinite}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;animation:float 9s ease-in-out infinite}
.o1{width:360px;height:360px;background:#ff3b49;top:-80px;left:-60px}
.o2{width:300px;height:300px;background:#ff8a5c;bottom:-60px;right:8%;animation-delay:-3s}
.o3{width:220px;height:220px;background:#fff;opacity:.18;top:40%;left:35%;animation-delay:-6s}
.htext{position:relative;z-index:2;max-width:640px}
.pill{display:inline-block;padding:6px 20px;border:1px solid rgba(255,255,255,.5);border-radius:99px;font-weight:600;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);background:rgba(255,255,255,.1);animation:pop .9s .1s both cubic-bezier(.2,1.6,.4,1)}
h1{font-size:clamp(46px,9vw,104px);line-height:1.05;font-weight:900;margin:22px 0 14px}
h1 .w{display:inline-block;overflow:hidden;vertical-align:bottom;padding:0 .04em}
h1 .w>span{display:inline-block;transform:translateY(115%) rotate(6deg);animation:rise .9s cubic-bezier(.2,.9,.2,1) forwards;animation-delay:calc(.35s + var(--k)*.18s)}
.sub{font-size:clamp(18px,2.4vw,26px);font-weight:600;opacity:0;animation:fade 1s 1.1s forwards}
.line{width:0;height:5px;border-radius:9px;background:#fff;margin:22px 0;animation:grow 1s 1s forwards}
.stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:34px}
.stat{min-width:104px;padding:12px 20px;border-radius:18px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.22);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);text-align:center;opacity:0;animation:pop .8s both cubic-bezier(.2,1.6,.4,1);animation-delay:calc(1.4s + var(--k)*.15s)}
.stat b{display:block;font-size:40px;line-height:1.1;font-weight:900}
.stat small{opacity:.85}
.emb{position:relative;z-index:2;width:min(380px,76vw);aspect-ratio:1;opacity:0;animation:pop 1.2s .5s forwards cubic-bezier(.2,1.4,.4,1)}
.emb svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 20px 50px rgba(0,0,0,.4))}
.spin{transform-origin:100px 100px;transform-box:view-box;animation:spin 16s linear infinite}
.spin2{transform-origin:100px 100px;transform-box:view-box;animation:spin 26s linear infinite reverse}
.core{transform-origin:100px 100px;transform-box:view-box;animation:beat 2.4s ease-in-out infinite}
.scroll{position:absolute;bottom:26px;left:50%;translate:-50% 0;z-index:2;width:28px;height:46px;border:2px solid #fff;border-radius:20px;opacity:.8}
.scroll::after{content:"";position:absolute;top:8px;left:50%;width:5px;height:9px;margin-left:-2.5px;border-radius:4px;background:#fff;animation:wheel 1.6s infinite}
.hero::before{z-index:1}

.logos{display:flex;gap:14px;margin-bottom:24px}
.logos img{width:72px;height:72px;border-radius:50%;box-shadow:0 8px 26px rgba(0,0,0,.4);animation:pop .9s cubic-bezier(.2,1.6,.4,1) backwards;animation-delay:calc(.1s + var(--k)*.15s);transition:transform .35s cubic-bezier(.2,1.8,.4,1)}
.logos img:hover{transform:scale(1.2) rotate(10deg)}
@keyframes kb{to{transform:scale(1.15) translate(-2%,1.5%)}}
/* sections */
main{position:relative;z-index:2;max-width:1180px;margin:0 auto;padding:70px 20px 160px;display:grid;grid-template-columns:repeat(2,1fr);gap:30px}
.cell{opacity:0;transform:translateY(60px) scale(.96);transition:opacity .9s cubic-bezier(.2,.8,.2,1),transform .9s cubic-bezier(.2,.8,.2,1)}
.cell.in{opacity:1;transform:none}
.cell.wide{grid-column:1/-1}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 18px 50px -20px rgba(125,5,14,.45);transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease-out,box-shadow .3s;height:100%}
.card:hover{box-shadow:0 30px 70px -20px rgba(209,15,28,.55)}
.head{position:relative;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:20px 26px;color:#fff;background:linear-gradient(110deg,#7d050e,#d10f1c);overflow:hidden}
.head::after{content:"";position:absolute;top:0;bottom:0;width:90px;left:-120px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);animation:sheen 4.5s ease-in-out infinite}
.head h2{margin:0;font-size:26px;font-weight:800}
.head small{opacity:.8;font-size:13px;letter-spacing:.04em}
.num{flex:none;width:50px;height:50px;border-radius:50%;background:#fff;color:var(--red);display:grid;place-items:center;font-weight:900;font-size:24px;box-shadow:0 0 0 0 rgba(255,255,255,.7);animation:ping 2.8s infinite}
.body{padding:10px 22px 20px}
.grp{display:inline-block;margin:16px 0 4px;padding:3px 16px;border-radius:99px;background:var(--red);color:#fff;font-weight:800;font-size:14px}
.q{display:flex;gap:12px;align-items:flex-start;padding:12px 6px;border-bottom:1px dashed var(--line);cursor:pointer;border-radius:12px;transition:background .25s,padding .25s}
.q:last-child{border-bottom:0}
.q:hover{background:var(--chip);padding-inline-start:14px}
.cell.in .q{animation:qin .7s cubic-bezier(.2,.9,.2,1) both;animation-delay:calc(.35s + var(--i)*.09s)}
.dot{flex:none;width:28px;height:28px;margin-top:2px;border-radius:50%;background:var(--chip);color:var(--red);display:grid;place-items:center;font-size:13px;font-weight:800;transition:all .4s cubic-bezier(.2,1.8,.4,1)}
.q .t{transition:color .3s,opacity .3s;text-decoration:line-through transparent;text-decoration-thickness:2px}
.q.done .dot{background:var(--red);color:#fff;transform:rotate(360deg) scale(1.15);font-size:0}
.q.done .dot::before{content:"✓";font-size:15px}
.q.done .t{opacity:.5;text-decoration-color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 8px 0;padding-inline-start:40px}
.chips span{padding:2px 12px;border-radius:99px;border:1px solid var(--line);background:var(--chip);color:var(--mut);font-size:13px;font-weight:600;transition:all .3s}
.chips span:hover{background:var(--red);color:#fff;transform:translateY(-3px) rotate(-3deg)}
.cols{display:grid;grid-template-columns:repeat(2,1fr);gap:0 36px}
/* closing */
.sign{grid-column:1/-1;text-align:center;color:#fff;border-radius:28px;padding:56px 20px;position:relative;overflow:hidden;background:linear-gradient(135deg,#1a0709,#8f0610 60%,#d10f1c);background-size:200% 200%;animation:shift 10s ease infinite}
.sign h2{font-size:clamp(28px,5vw,46px);margin:0 0 10px;font-weight:900}
.sign .boss{font-size:26px;font-weight:800}
.deps{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.deps span{padding:8px 26px;border-radius:99px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.1);font-weight:700;transition:transform .3s,background .3s}
.deps span:hover{transform:translateY(-6px) scale(1.06);background:rgba(255,255,255,.25)}
/* dock */
.dock{position:fixed;z-index:60;left:50%;translate:-50% 0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;padding:8px;border-radius:99px;background:rgba(25,8,11,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 14px 40px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.14);color:#fff;animation:dockin 1s 2.2s both cubic-bezier(.2,1.4,.4,1)}
.dock button{font:inherit;color:#fff;border:0;cursor:pointer;border-radius:99px;padding:8px 16px;background:rgba(255,255,255,.1);font-weight:700;transition:transform .2s,background .2s;display:flex;align-items:center;gap:8px;min-height:44px}
.dock button:hover{background:var(--red);transform:translateY(-3px)}
.dock button:focus-visible,.q:focus-visible,.m button:focus-visible{outline:3px solid #ff8a93;outline-offset:2px}
.dock .prog{padding:0 12px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.ring{width:28px;height:28px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4}
#rg{stroke:#ff4d5a;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.timeup{animation:pulse .7s infinite alternate}
/* modal */
.m{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;background:rgba(10,2,4,.78);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .4s}
.m.on{opacity:1;pointer-events:auto}
.mc{width:min(720px,100%);padding:44px 30px 30px;border-radius:30px;text-align:center;color:#fff;background:linear-gradient(135deg,#7d050e,#d10f1c);box-shadow:0 40px 120px rgba(209,15,28,.5);transform:scale(.6) rotate(-4deg);transition:transform .6s cubic-bezier(.2,1.5,.4,1)}
.m.on .mc{transform:none}
.mc .tag{display:inline-block;padding:3px 18px;border-radius:99px;background:rgba(255,255,255,.2);font-weight:700}
.mc p{font-size:clamp(24px,4.4vw,40px);font-weight:900;line-height:1.5;margin:22px 0 28px;min-height:4.5em;display:grid;place-items:center}
.mc p.roll{filter:blur(2px);opacity:.7}
.mc p.land{animation:land .7s cubic-bezier(.2,1.6,.4,1)}
.mb{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.mb button{font:inherit;font-weight:800;border:0;cursor:pointer;border-radius:99px;padding:10px 24px;min-height:44px;background:#fff;color:var(--red2);transition:transform .2s}
.mb button:hover{transform:translateY(-3px) scale(1.05)}
.mb .g{background:rgba(255,255,255,.18);color:#fff}
#cf{position:fixed;inset:0;width:100%;height:100%;z-index:90;pointer-events:none}
@keyframes shift{50%{background-position:100% 100%}}
@keyframes drift{to{background-position:34px 34px}}
@keyframes float{50%{transform:translate(40px,-50px) scale(1.15)}}
@keyframes rise{to{transform:none}}
@keyframes fade{to{opacity:1}}
@keyframes grow{to{width:180px}}
@keyframes pop{from{opacity:0;transform:scale(.4) translateY(30px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes beat{50%{transform:scale(1.14)}}
@keyframes wheel{to{transform:translateY(16px);opacity:0}}
@keyframes sheen{60%,100%{left:120%}}
@keyframes ping{70%{box-shadow:0 0 0 16px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
@keyframes qin{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes dockin{from{opacity:0;transform:translateY(90px)}to{opacity:1;transform:none}}
@keyframes pulse{to{background:var(--red);transform:scale(1.07)}}
@keyframes land{from{transform:scale(.4) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
@media (max-width:820px){main{grid-template-columns:1fr}.cols{grid-template-columns:1fr}.hero{padding-top:60px}.dock .lbl{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important}.cell{opacity:1;transform:none}h1 .w>span{transform:none}}
/* iOS touch hardening */

  </div>
</div>

<script>
const S=[
{t:"التعارف والتحفيز",e:"Introduction & Motivation",g:[{q:["عرّفنا بنفسك (الكلية، الفرقة، اهتماماتك) في دقيقتين.","إيه اللي عرّفك على اللجنة، وليه اخترت التنظيم بالذات؟","تتوقع إيه من شغلك معانا، وإيه اللي تحب تطوره في نفسك؟","شاركت قبل كده في فعاليات أو أنشطة طالبية؟ كان دورك فيها إيه؟"]}]},
{t:"فهم دور التنظيم",e:"Understanding the Role",g:[{q:["من وجهة نظرك، إيه الفرق بين عضو التنظيم والحضور العادي؟","ليه التنظيم مهم لنجاح أي فعالية؟","لو الفعالية نجحت، هل التنظيم هو السبب؟ وإزاي نعرف إنه نجح؟"]}]},
{t:"الصفات الأساسية للعضو",e:"Core Traits",wide:1,cols:1,g:[
{h:"الالتزام بالمواعيد",q:["لو اتفقنا على حضور 8 الصبح والمواصلات اتأخرت، تعمل إيه؟","حصل إنك اتأخرت على التزام مهم؟ إزاي اتصرفت؟"]},
{h:"العمل تحت ضغط",q:["احكي عن موقف كنت فيه تحت ضغط وقت أو مسؤولية، وطلعت منه إزاي.","لو معاك 3 مهام في نفس الوقت، تبدأ بإيه؟"]},
{h:"التعاون",q:["اشتغلت في فريق قبل كده؟ لو حد في الفريق مش بيشتغل، تتصرف إزاي؟","تفضل تشتغل لوحدك ولا في فريق؟ ليه؟"]},
{h:"التواصل وامتصاص الغضب",q:["حد من الحضور اتعصب عليك ومش راضي يسمع الكلام، تتعامل معاه إزاي؟","إزاي توصل معلومة لشخص مش متفاعل معاك؟"]},
{h:"الابتكار وحل المشكلات",q:["الميكروفون وقف في نص الفعالية، تعمل إيه في أول دقيقة؟","الحضور أكتر من عدد الكراسي، إيه الحل؟"]}]},
{t:"أسئلة المواقف",e:"Scenario Questions",wide:1,g:[{q:["ضيف VIP وصل بدري وقاعة الاستقبال لسه مش جاهزة، تتصرف إزاي؟","حد من الحضور تعب فجأة أثناء الفعالية، إيه خطواتك؟","حصل خلاف بين اتنين من الأعضاء قدام الحضور، تعمل إيه؟","المحاضر أونلاين مش قادر يدخل الميتنج قبل البداية بـ 10 دقايق، إيه الحل؟","الحضور على الزوم كتير وفيه ناس بتتكلم من غير ما تفتح المايك، تتعامل إزاي؟"]}]},
{t:"ميول القسم",e:"Section Preference",g:[{q:["أي قسم من أقسام التنظيم حابب تشتغل فيه، وليه؟","ولو اتحطيت في قسم تاني، هتتقبل؟","تعرف أدوات الاجتماعات الأونلاين زي Zoom أو Meet أو Teams؟ استخدمتها قبل كده؟"],chips:["Planning","Logistics","Registration","Protocol","Floor","Backstage","Emergency"]}]},
{t:"الالتزام والوقت",e:"Commitment",g:[{q:["إيه الوقت اللي تقدر تدّيه للجنة أسبوعيًا؟","عندك ارتباطات (دراسة، شغل، تدريب) ممكن تتعارض مع الفعاليات؟","تقبل تحضر فعاليات في الإجازة أو آخر الأسبوع؟"]}]},
{t:"أسئلة ختامية",e:"Closing Questions",wide:1,g:[{q:["ليه نختارك إنت بالذات؟","نقطة قوتك ونقطة ضعفك؟","عندك أي سؤال لينا؟"]}]}
];
const $=s=>document.querySelector(s),A=s=>[...document.querySelectorAll(s)],ar=n=>n.toLocaleString('ar-EG');
const flat=[];let gi=0,html='';
S.forEach((s,si)=>{
  let inner='';
  s.g.forEach(g=>{
    if(g.h)inner+=`<span class="grp">${g.h}</span>`;
    let k=0;
    g.q.forEach(q=>{
      flat.push({q,s:s.t});
      inner+=`<div class="q" tabindex="0" role="checkbox" aria-checked="false" data-i="${gi}" style="--i:${k++}"><span class="dot">${k}</span><span class="t">${q}</span></div>`;
      gi++;
      if(g.chips&&k===1)inner+=`<div class="chips">${g.chips.map(c=>`<span>${c}</span>`).join('')}</div>`;
    });
  });
  html+=`<section class="cell${s.wide?' wide':''}"><div class="card"><div class="head"><div><h2>${s.t}</h2><small>${s.e}</small></div><div class="num">${ar(si+1)}</div></div><div class="body${s.cols?' cols':''}">${inner}</div></div></section>`;
});
html+=`<section class="cell sign"><h2>مع تحيات مركزية التنظيم</h2><div class="boss">م. إسلام فارس</div><div>رئيس اللجنة المركزية</div><div style="margin-top:18px;opacity:.85">نواب اللجنة</div><div class="deps"><span>أ. ريم منصور</span><span>أ. إسلام العربي</span><span>أ. أحمد حسن</span></div></section>`;
$('#main').innerHTML=html;

/* reveal + counters */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
A('.cell').forEach(c=>io.observe(c));
A('[data-to]').forEach((el,n)=>{const to=+el.dataset.to,pre=el.dataset.pre||'';let st=null;
  const f=t=>{st=st||t;const p=Math.min((t-st)/1400,1),v=Math.round(to*(1-Math.pow(1-p,3)));el.textContent=pre+ar(v);if(p<1)requestAnimationFrame(f)};
  setTimeout(()=>requestAnimationFrame(f),1500+n*150)});

/* progress + glow */
addEventListener('scroll',()=>{const h=document.documentElement;$('#bar').style.width=(scrollY/(h.scrollHeight-innerHeight)*100)+'%'},{passive:true});
addEventListener('pointermove',e=>{const g=$('#glow').style;g.setProperty('--x',e.clientX+'px');g.setProperty('--y',e.clientY+'px')});

/* tilt */
if(matchMedia('(hover:hover) and (pointer:fine)').matches){
  A('.card').forEach(c=>{
    c.addEventListener('pointermove',e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.setProperty('--ry',(x*7)+'deg');c.style.setProperty('--rx',(-y*7)+'deg')});
    c.addEventListener('pointerleave',()=>{c.style.setProperty('--ry','0deg');c.style.setProperty('--rx','0deg')});
  });
}

/* done state */
const done=new Set();
function mark(i,on){const el=document.querySelector(`.q[data-i="${i}"]`);if(!el)return;
  on?done.add(i):done.delete(i);el.classList.toggle('done',on);el.setAttribute('aria-checked',on);
  $('#pg').textContent=ar(done.size)+' / '+ar(flat.length);
  if(done.size===flat.length&&on)confetti();}
A('.q').forEach(q=>{const t=()=>mark(+q.dataset.i,!q.classList.contains('done'));
  q.addEventListener('click',t);q.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();t()}})});
$('#pg').textContent='٠ / '+ar(flat.length);

/* random question */
let cur=-1,rt=null;
function pick(){const pool=flat.map((_,i)=>i).filter(i=>!done.has(i));return pool.length?pool[Math.floor(Math.random()*pool.length)]:-1}
function roll(){
  clearInterval(rt);const p=$('#mq');p.className='roll';let n=0;
  rt=setInterval(()=>{const r=flat[Math.floor(Math.random()*flat.length)];p.textContent=r.q;$('#mt').textContent=r.s;
    if(++n>16){clearInterval(rt);cur=pick();if(cur<0){p.textContent='خلصت كل الأسئلة 🎉';$('#mt').textContent='ممتاز';p.className='land';return}
      p.textContent=flat[cur].q;$('#mt').textContent=flat[cur].s;p.className='land';}},75);
}
function openM(){$('#m').classList.add('on');roll()}
function closeM(){$('#m').classList.remove('on');clearInterval(rt)}
$('#rnd').onclick=openM;$('#ma').onclick=roll;$('#mx').onclick=closeM;
$('#md').onclick=()=>{if(cur>=0)mark(cur,true);roll()};
$('#m').addEventListener('click',e=>{if(e.target.id==='m')closeM()});
addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});

/* timer */
let left=900,run=null;
const show=()=>{const m=Math.floor(left/60),s=left%60;$('#tt').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  $('#rg').style.strokeDashoffset=94.25*(1-left/900)};
$('#tm').onclick=()=>{if(run){clearInterval(run);run=null;return}
  run=setInterval(()=>{left--;show();if(left<=0){clearInterval(run);run=null;$('#tm').classList.add('timeup')}},1000)};
$('#rs').onclick=()=>{clearInterval(run);run=null;left=900;$('#tm').classList.remove('timeup');show()};

/* clear all */
let clT=null;
function disarm(){const b=$('#cl');b.classList.remove('arm');b.querySelector('.ic').textContent='🗑';b.title='مسح كل التحديدات'}
$('#cl').onclick=()=>{const b=$('#cl');if(!done.size)return;
  if(!b.classList.contains('arm')){b.classList.add('arm');b.querySelector('.ic').textContent='❗';b.title='دوس تاني للتأكيد';clT=setTimeout(disarm,3000);return}
  clearTimeout(clT);done.clear();A('.q').forEach(q=>{q.classList.remove('done');q.setAttribute('aria-checked','false')});
  $('#pg').textContent=ar(0)+' / '+ar(flat.length);disarm()};

/* theme */
$('#th').onclick=()=>{const d=document.documentElement,dark=d.dataset.theme?d.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;d.dataset.theme=dark?'light':'dark'};

/* confetti */
function confetti(){
  const c=$('#cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#d10f1c','#ff4d5a','#fff','#ffd166','#ff8a5c'];
  const ps=Array.from({length:170},()=>({x:innerWidth/2,y:innerHeight*.7,vx:(Math.random()-.5)*18,vy:-Math.random()*20-6,s:Math.random()*8+4,r:Math.random()*6,vr:Math.random()*.3-.15,c:cols[Math.floor(Math.random()*5)]}));
  let f=0;(function d(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});
    if(++f<170)requestAnimationFrame(d);else x.clearRect(0,0,c.width,c.height)})();
}
</script>
